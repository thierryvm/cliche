# Cliche - continuous integration
#
# Runs on windows-latest and nowhere else, on purpose: the capture layer is
# irreducibly Windows (see docs/STACK.md), so a green Linux job would prove
# nothing about the product. A cross-platform matrix would cost minutes and
# buy false confidence.
#
# Action versions were checked against the GitHub API on 2 September 2026:
#   actions/checkout      v7.0.1   (2026-07-20)
#   actions/setup-node    v7.0.0   (2026-07-14)
#   pnpm/action-setup     v6.0.10  (2026-08-03)
#   Swatinem/rust-cache   v2.9.2   (2026-08-06)
# dtolnay/rust-toolchain is pinned to the rolling `stable` tag by design: its
# last GitHub release is from 2022 and the branch tags are what it ships.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: this workflow reads the repository and nothing else.
# It publishes nothing, comments nothing, and needs no token beyond that.
permissions:
  contents: read

# A second push to the same branch cancels the first. Windows minutes are
# the scarce resource here even on a public repository, where they are free
# but not instant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Quality gates
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11.7.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Cheapest gate first: it needs neither Rust nor node_modules to be
      # meaningful, and it is the one that catches a half-finished release.
      - name: One version, three files
        run: node scripts/check-version.mjs

      # Same class of fact as the version number: something a human copied by
      # hand into a comment. Recomputed from src/design/tokens.css, so a token
      # that moves cannot quietly leave a false ratio behind it.
      - name: Contrast of the design tokens
        run: node scripts/check-contrast.mjs

      - name: TypeScript - strict, zero any
        run: pnpm typecheck

      # THIS STEP IS NOT OPTIONAL, and the reason is structural: this workflow
      # calls every gate INDIVIDUALLY and never runs `pnpm test`. A runner added
      # to that script alone would be green on the contributor's machine and
      # absent from CI, which is the failure mode that leaves a suite rotting
      # unnoticed. `pnpm test` gained `vitest run` too - both, or neither.
      #
      # Placed here, among the fast gates: it needs node_modules and nothing
      # else, and it finishes long before the Rust toolchain is even installed.
      - name: Vitest - the veil's zone model
        run: pnpm test:unit

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      # -D warnings: a warning that CI tolerates is a warning nobody reads.
      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Rust unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

  build:
    name: Windows build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11.7.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # The build is a gate, not an optional step. Some failures appear only
      # here - a dependency whose distribution does not expose the expected
      # export passes typecheck and tests, then breaks the bundle.
      - name: Tauri build
        run: pnpm tauri build

      # Kept for the day a release is cut: the installer is the artifact a
      # human would actually download, and a build that produces nothing
      # downloadable has not been verified end to end.
      - name: Keep the installer
        uses: actions/upload-artifact@v7
        with:
          name: cliche-nsis-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 7
