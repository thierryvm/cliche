[package]
name = "cliche"
version = "0.1.0"
description = "Local screenshot utility for Windows"
edition = "2021"
rust-version = "1.77.2"
publish = false

# The logic lives in a library so it can be unit-tested with `cargo test`
# without going through the binary entry point.
[lib]
name = "cliche_lib"
path = "src/lib.rs"

[[bin]]
name = "cliche"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# 2.11.5 is the version verified on crates.io on 2 September 2026. Said
# precisely, because a comment here once claimed more than the line does: this
# is a CARET requirement, `>=2.11.5, <3.0.0`, so a `cargo update` may move it to
# 2.12 or beyond. What actually holds 2.11.5 is Cargo.lock, which is committed.
tauri = { version = "2.11.5", features = [] }
# Required for #[derive(Serialize)] on the command's return type. Tauri depends
# on serde already; declaring it here is what lets us use the derive macro.
serde = { version = "1", features = ["derive"] }

# --- Lot 1: the skeleton that MEASURES ---
# Versions checked against the crates.io API on 3 September 2026.

# The global shortcut is registered from RUST, not from JavaScript. The handler
# has to run before the webview is involved at all, and the JS counterpart
# package would add a round trip to the very budget being measured. That is why
# no `@tauri-apps/plugin-global-shortcut` appears in package.json.
tauri-plugin-global-shortcut = "2.3.2"

# Writes the captured region to the clipboard, from Rust. Chosen over `arboard`,
# which has had no release since 23 August 2025 while this one shipped on
# 31 August 2026. `Clipboard::write_image(&self, image: &Image<'_>)` was read on
# docs.rs before being relied on here, not assumed.
tauri-plugin-clipboard-manager = "2.3.3"

# One Cliche at a time. Added 7 September 2026, against the ghost process
# described in `src/lifecycle.rs`: a second launch hands the screen back to the
# first process and stops, instead of asking Windows for a global shortcut the
# first process is still holding.
#
# 2.4.4 was verified on the crates.io API on 7 September 2026: published
# 2026-08-31, Apache-2.0 OR MIT, and it requires `tauri ^2.10`, which the 2.11.5
# above satisfies. Same caveat as the `tauri` line: this is a caret requirement,
# and what actually holds 2.4.4 is Cargo.lock.
#
# It adds NO capability and NO ACL entry: the plugin exposes no JavaScript API,
# so nothing of it is reachable through `invoke` and there is nothing for a
# capability to grant. Read on v2.tauri.app/plugin/single-instance on
# 7 September 2026 - "Because this Plugin currently does not have JavaScript
# APIs you do not have to configure capabilities to use it" - and consistent
# with `ipc.rs`'s sentinel, which reads this crate's own `generate_handler!` and
# finds nothing new there.
tauri-plugin-single-instance = "2.4.4"

# Screen capture. A one-shot API, and cross-platform, which keeps the capture
# layer behind a seam even though only Windows ships. `windows-capture` aims at
# continuous capture and costs more to set up; moving to it would be the result
# of a measurement, never an a-priori choice.
xcap = "0.9.8"

# Cropping and PNG encoding. Declared explicitly rather than leaned on as a
# transitive dependency of xcap: xcap requires `image ^0.25`, the same line, so
# cargo unifies to ONE copy and its RgbaImage is literally our type. A different
# major line would give two incompatible types with identical names, which is
# among the least readable errors Rust produces.
# PNG only: the default feature set pulls jpeg, gif, webp and tiff decoders that
# a screenshot tool never reads.
image = { version = "0.25.10", default-features = false, features = ["png"] }

# No networking crate, no telemetry, no logging backend: this application talks
# to nobody. Startup diagnostics go to stdout, which `pnpm tauri dev` shows.

# --- The FIRST native dependency of this crate, 7 September 2026 ---
#
# Under a TARGET table and not in `[dependencies]`, and that placement is the
# whole portability contract of `src/compositor.rs`: on macOS and Linux this line
# is not resolved, not fetched and not compiled. What those systems get is the
# `#[cfg(not(windows))]` engine in that same file, which does nothing native and
# says so.
#
# `0.61` and NOT a newer line, deliberately. Cargo.lock already holds
# `windows 0.61.3` as a dependency of `tauri 2.11.5` (it is listed in tauri's own
# dependency block there), so this caret requirement unifies onto that one copy:
# no new crate enters the graph, and - the part that matters - the `HWND` Tauri
# hands back from `WebviewWindow::hwnd()` is LITERALLY the type these functions
# take. A different major line would give two incompatible types with the same
# name, which is the trap the `image` line thirty rows above was written to avoid.
#
# Two features, both read on docs.rs/crate/windows/0.61.3/features on 7 September
# 2026. `Win32_Graphics_Dwm` carries `DwmFlush`, `DwmSetWindowAttribute` and
# `DWMWA_TRANSITIONS_FORCEDISABLED`; it lists only `Win32_Graphics` as its own
# dependency, so `Win32_Foundation` - which is where the `HWND` those signatures
# take is declared - is named here rather than hoped for. Features are additive
# across the graph, so naming one Tauri may already enable costs nothing.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Dwm"] }

[dev-dependencies]
# The SAME crate and version, with `bmp` added FOR TESTS ONLY.
#
# `capture::encode_bmp` writes a BMP header by hand. Checking the 66 bytes field
# by field proves it matches the layout we wrote down; it does not prove a real
# decoder accepts it. This gives the suite an INDEPENDENT reader for the
# round-trip test - one that knows nothing about our encoder.
#
# Resolver v2 (implied by edition 2021) keeps dev-dependency features out of
# normal builds, so no BMP decoder is linked into the application. The visible
# cost is that `cargo build` and `cargo test` compile `image` with different
# feature sets and therefore recompile it when alternated.
image = { version = "0.25.10", default-features = false, features = ["png", "bmp"] }

# Measuring is the entire point of lot 1, and an unoptimised build makes the
# instrument lie. Both hot spots are byte loops over 8.29 MB living in
# DEPENDENCIES, not in code written here: xcap's BGRA->RGBA swap, and the PNG
# compressor in `image`. Measured on 3 September 2026 in a plain dev build:
# capture 140.8 ms median, encode_png 917.4 ms median -- against a 150 ms budget
# for the WHOLE path. Concluding "Tauri does not hold" from those figures would
# be a false negative of the worst kind: it would move an entire surface to
# native code for a reason that does not exist.
#
# So dependencies compile optimised while THIS crate stays unoptimised and
# debuggable. Deliberately NOT a release build: it changes nothing about what
# ships, it stops the instrument from lying about code nobody here wrote.
#
# This table must stay at the END of the file. It was first written just above
# the lot 1 dependencies, which silently moved them INTO the profile table --
# TOML gives every key after a header to that header -- and the build failed
# with twelve unrelated-looking errors.
[profile.dev.package."*"]
opt-level = 3
