# Application permission for the shortcut registry.
#
# The reasoning for this whole directory - what it arms, and why nothing here is
# named `default` - is written once, in `veil.toml`.

[[permission]]
identifier = "allow-describe-shortcut-status"
description = "Lets the main window read what the operating system ANSWERED when this application offered it the capture combination at startup: accepted, refused by the system with the reason it gave, or never attempted with what stopped it. Reads managed state written once in `setup`; it registers nothing, changes nothing and captures nothing. Granted to `main` only - it is what the launcher's shortcut reminder is drawn from, and the veil has no help page. Ungranted, the launcher falls back to saying the registry could not be read, which is what it wrongly said about every one of these cases until 6 September 2026."
commands.allow = ["describe_shortcut_status"]

[[permission]]
identifier = "allow-set-capture-shortcut"
description = "Lets the main window CHANGE the combination that starts a capture. Added 6 September 2026 with the settings screen. It is the widest of the three shortcut commands by a distance: it takes a global hotkey away from the operating system - a combination every other application then stops receiving - and it writes one file, `settings.json`, in this application's own configuration folder. It reads nothing else from the machine and captures nothing. The combination is validated by `shortcuts::accept` before the system is asked: no bare key, no modifier this application cannot draw, no key it has no cap for. A combination the system refuses leaves the PREVIOUS one registered - `shortcut::change` is where that rollback lives and where it is tested. Granted to `main` only: the veil has no settings screen, and a full-screen sheet that could rebind the shortcut which produced it is not a thing anyone needs."
commands.allow = ["set_capture_shortcut"]

[[permission]]
identifier = "allow-describe-shortcuts"
description = "Lets the main window read the shortcut registry: for each combination, its identifier, the accelerator Rust registers, the keys as they are drawn, a key into the string catalogue, and a category. Static data chosen by this application; it reads nothing from the machine and captures nothing. Granted to `main` only, not because the table is sensitive but because every command of this crate names the window it serves - see the note on `describe_displays` in displays.rs."
commands.allow = ["describe_shortcuts"]
