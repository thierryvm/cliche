# Single-package repository: the frontend lives at the root, the Rust backend in
# src-tauri/ and is driven by cargo, not by pnpm.
#
# This file exists for two reasons:
#   1. it pins the repository root for pnpm, so a stray install run from a
#      subdirectory cannot create a second node_modules tree;
#   2. pnpm 11 reads settings from here, NOT from the "pnpm" field of
#      package.json any more (measured on 2 September 2026: that field is read,
#      then ignored, with a warning).
packages:
  - '.'

# Dependencies permitted to run install scripts, and why. pnpm 11 WRITES this
# block itself when it meets an ignored build, seeding it with the placeholder
# "set this to true or false" -- which is neither, so the build stays ignored
# and `pnpm install` exits 1. Measured on 2 September 2026: removing the block
# does not help, pnpm puts it back on the next install. It has to be ANSWERED.
#
#   esbuild - Vite's bundler. Its postinstall places the platform-specific
#   binary. Reviewed and allowed deliberately.
allowBuilds:
  esbuild: true

# NOTE: `onlyBuiltDependencies` used to sit here as well. It was removed on
# 2 September 2026 after measurement: with it present and `allowBuilds` unset,
# esbuild's postinstall was STILL skipped and `pnpm install` exited 1. It
# configured nothing while looking like it did, which is worse than absent.
