    <meta charset="UTF-8" />
    <title>Cliché veil</title>
    <!--
      A SEPARATE entry point, on purpose.

      This document must not load React or the application window's stylesheet.
      Two reasons, and the second is the one that matters:

      1. It pollutes the measurement. Lot 1d asks how long it takes to paint a
         frozen screen; a bundle that boots a framework first answers a
         different question.
      2. It pollutes the product. The veil has no state and no theme. Anything
         it loads is weight paid on every capture, for ever.

      THE DESIGN TOKENS ARE THE EXCEPTION - and an earlier version of this
      comment forbade them, which was wrong. `src/design/tokens.css` is linked
      below, and it costs the budget nothing for the same reason this window
      exists at all: the veil window is PREHEATED at startup
      (src-tauri/src/veil.rs), so this document is parsed and this stylesheet is
      fetched, resolved and applied seconds before any shortcut is pressed. At
      capture time the custom properties are already computed values.

      The alternative was to retype --veil-scrim, --veil-stroke-light,
      --veil-stroke-dark and --veil-stroke-width here. That is exactly the
      second list of colours
      tokens.css opens by forbidding - and worse than usual, because
      scripts/check-contrast.mjs measures the ORIGINALS: a copy here would drift
      away from the file that is checked, and the build would keep saying the
      contrast is fine about values this page no longer uses.

      THE COMPONENT LAYER IS THE SECOND EXCEPTION, since 5 September 2026, and
      an earlier version of this comment forbade it outright. What changed is
      the product: a capture now ends with a CONFIRMATION - or, when the
      clipboard refuses, with a failure that stays until it is dismissed - and
      that message is a component the design system already publishes,
      `c-note c-note--success c-toast` (src/design/Showcase.tsx, section
      s-toast). SINCE 7 SEPTEMBER 2026 there is a second consumer, and it is the
      same argument arriving from the other end: the keyboard line was drawn
      here, full width, and it took a user reading it as a rendering artefact to
      notice that no page in this repository had ever shown it. It is
      `.c-veil-hint` now, published in section s-veil. The alternative was to
      restate `.c-note`, `.c-toast`,
      `.c-toast-region`, `.c-toast__message`, `.c-toast__dismiss`, `.c-btn`,
      `.c-btn--ghost`, `.c-btn--icon` and `.c-btn__glyph` here - eight
      components copied into a page nobody would think to update, which is the
      same drift the token file's own header opens by forbidding, and worse:
      scripts/check-contrast.mjs measures the ORIGINALS.

      WHAT IT COSTS THE BUDGET: nothing, for the same reason the token file
      costs nothing. Both are fetched, parsed and applied during the PREHEAT,
      seconds before any shortcut. What it costs afterwards is selector matching
      on a document of fourteen elements, at every style recalculation.

      WHAT IT DOES NOT BRING IN, checked rather than assumed: components.css
      declares no `html`, `body` or `*` rule. Two of its blocks select something
      other than a class - a `:root` carrying the component constants, and the
      `[hidden] { display: none !important }` guard of 7 September 2026, which
      this document depends on rather than suffers - so nothing in it repaints
      this document or changes its layout. (This read "a :root of four component
      constants" until today. It was already stale - there were ten in that
      block, and today's --c-screen-max makes eleven - and a figure nobody
      maintains is worse than no figure, so it is gone.) Its one
      `backdrop-filter` belongs to `.c-glass,
      .c-titlebar`; neither class exists in this file, and a rule that matches
      no element builds no compositor layer. `.c-veil-hint`, which this document
      DOES use, declares none of the four properties that build a layer at parse
      - the rule above it in that file names them, and src/documents.test.ts
      holds this document to the same ban. It has no @import, no url() and no
      @font-face, so it adds no request.

      The rules below are inline rather than a third stylesheet: they are
      specific to this document and a separate file would be one more request.
      `style-src` already allows 'unsafe-inline'; no CSP change is needed, and
      both linked files are served from 'self', which `default-src` covers.
    -->
    <link rel="stylesheet" href="/src/design/tokens.css" />
    <link rel="stylesheet" href="/src/design/components.css" />
    <style>
      /*
       * --veil-grip-outset and --veil-grip-room now live in
       * src/design/tokens.css, next to --veil-handle-size, and this file only
       * consumes them. They were declared here for one commit because that
       * file was reserved; a token defined in two places is exactly the drift
       * its own header opens by forbidding.
       */
      /*
       * ON THE ROOT AND NOWHERE ELSE. The declaration moved here from `body`,
       * and the move is not tidying.
       *
       * A root element that carries a background has its background propagated
       * to the canvas AND does not paint it a second time on its own box - that
       * is one full-screen fill, and it is the one that was always here. A
       * <body> carrying the same colour is a different matter: propagation from
       * BODY only happens when the root's background is transparent, so a body
       * with a background of its own paints it, over its own box. That cost
       * nothing while body's box was zero pixels tall (every element in this
       * document is `position: fixed`, so body has no in-flow content); it
       * would have become a second full-screen opaque fill the moment `height`
       * below gave body a real box, inside the very interval lot 1d measures.
       *
       * Black, not white: the window becomes visible one instant before the
       * image is decoded, and a white flash on a dark screen is far more
       * violent than a black one.
       */
      html {
        background: #000;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;

        /* The zero-height body above is also a hit-testing fact: anywhere but
           the very top of the screen, the box under the pointer is <html>.
           Giving both a real box removes the question. It buys no paint - body
           has no background of its own now, and html's is the canvas. */
        height: 100%;

        /* A drag here draws a rectangle. It must not start a text selection,
           and it must not start the native drag of the image below. */
        user-select: none;
        -webkit-user-select: none;
      }

      /*
       * THE CURSOR, AND WHY IT IS ON <html> ALONE.
       *
       * "You are choosing a rectangle", before any pixel is dimmed. It costs
       * nothing to paint.
       *
       * It was declared on `html, body` together until this lot, so that the
       * root - which is what the pointer lands on over a zero-height body -
       * would carry it. <html> still must, and does. The COPY on <body> is what
       * had to go: `cursor` inherits, so body already gets this value from the
       * root, and its own declaration would have beaten the inherited one from
       * the rules below - every per-zone cursor would have been correct on the
       * root and crosshair over body, which is to say everywhere the pointer
       * actually is.
       */
      html {
        cursor: crosshair;
      }

      /*
       * The zone under the pointer, written by main.ts onto the root and read
       * back here. An attribute rather than five classes: one write per change,
       * and the absent case IS the crosshair above.
       *
       * During a drag the attribute is held to the gesture and stops following
       * the pointer, so leaving the cell you grabbed does not change the cursor
       * mid-resize. The names are the two DIAGONALS, not the corners: a corner
       * dragged past its opposite one turns nwse into nesw, and the attribute
       * is recomputed from the live geometry on every move.
       */
      html[data-veil-cursor='move'] {
        cursor: move;
      }

      html[data-veil-cursor='nwse'] {
        cursor: nwse-resize;
      }

      html[data-veil-cursor='nesw'] {
        cursor: nesw-resize;
      }

      html[data-veil-cursor='ns'] {
        cursor: ns-resize;
      }

      html[data-veil-cursor='ew'] {
        cursor: ew-resize;
      }

      /* The frozen screen is captured at the monitor's PHYSICAL pixel size, and
         the window is sized to the same rectangle, so 100vw/100vh is a 1:1 map.
         `object-fit: fill` rather than `contain`: a letterbox would mean the
         two sizes disagree, and hiding that would hide a real bug. */
      #frame {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        object-fit: fill;
        display: block;
        /* The image never answers the pointer: that kills WebView2's native
           image drag outright, and every pointer event lands on the document
           where main.ts listens for it. */
        pointer-events: none;
      }

      /* REDUNDANT SINCE 7 SEPTEMBER 2026, and kept anyway. `display: block`
         above beats the browser's own `[hidden] { display: none }` - author
         declarations win over UA ones whatever their specificity - so this
         element needed a rule of its own. It no longer does: components.css,
         linked above, now carries `[hidden] { display: none !important }` for
         the whole product. This one stays because it makes THIS document
         readable on its own: the frame's rule sits next to the frame's
         `display`, where the next person edits it. */
      #frame[hidden] {
        display: none;
      }

      /*
       * THE EDGE FRAME. The answer to "did the shortcut actually fire?".
       *
       * THE DEFECT IT REPAIRS. This veil shows a pixel-exact copy of the screen
       * it covers. A layer identical to what it hides is invisible BY
       * CONSTRUCTION - not by oversight. On 4 September 2026 the shortcut was
       * pressed and the screen looked untouched; the only way to know it had
       * worked was to move the mouse and notice the crosshair. A cursor is too
       * quiet to say "the capture is armed", and it says nothing at all to a
       * hand that has not moved yet.
       *
       * WHY A THIN FRAME AND NOT A DIM ON ENTRY. Two reasons, and the second is
       * the product one. First, the cost is bounded BY GEOMETRY rather than by
       * a number nobody has: on a 1920 x 1080 screen the veil composes
       * 2 073 600 px, and a 4 px band round the whole perimeter covers
       * 1920x1080 - 1912x1072 = 23 936 of them, 1.15 %. Second, dimming the
       * moment the veil opens obscures exactly what the user is aiming at; the
       * scrim on #selection below already dims, at the moment that helps -
       * once the drag has started.
       *
       * WHY THE TWO-TONE PAIR AND NOT A COLOUR. This band lands on a screenshot
       * whose content is unknown, which is the selection edge's problem exactly,
       * and tokens.css answers it once and measurably: the light hairline
       * doubled by the dark one, of which the BETTER never drops below 4.58:1
       * at any backdrop luminance (swept in scripts/check-contrast.mjs).
       * Choosing one colour by eye is choosing the one that vanishes on half
       * the desktops it will meet.
       *
       * Dark outside, light inside - the same order as #selection, so the two
       * read as one signature. Both hairlines are INSET here, because a screen
       * edge has no outside to hang the dark one on. Two token-widths of each
       * rather than one: 1 px of CSS at the 125 % or 150 % Windows scaling this
       * app already handles (src-tauri/src/geometry.rs) falls across a
       * fractional device pixel, where the renderer blends it toward the grey
       * the pair exists to avoid.
       *
       * ITS OWN ELEMENT, not an inset shadow on #frame: it must be there from
       * the instant the window appears, including the black moment before the
       * image has decoded - which is the part of the wait a user is most likely
       * to read as "nothing happened".
       */
      #edge {
        position: fixed;
        inset: 0;
        /* No background is declared, so nothing but these two rings is ever
           rasterised - the 1.15 % above is the whole of it. */
        box-shadow:
          inset 0 0 0 calc(var(--veil-stroke-width) * 2) var(--veil-stroke-dark),
          inset 0 0 0 calc(var(--veil-stroke-width) * 4)
            var(--veil-stroke-light);
        /* Mandatory, not tidiness: this element covers the entire veil, and
           without this line it would swallow the very drag it announces. */
        pointer-events: none;
      }

      /*
       * THE SELECTION. One element carries the whole overlay: the two-tone
       * edge AND the scrim over everything outside it, as three box-shadows.
       *
       * It exists in the document from startup, hidden. Nothing is constructed
       * at capture time.
       *
       * NOTE ON THE BUDGET - deliberate, and worth re-reading before "fixing"
       * it: this element is `hidden` until the first pointer press, so the veil
       * as PAINTED is what it was before this lot: one image, no blending
       * layer. The scrim appears when the user starts choosing, which is after
       * the paint and outside the 150 ms. Dimming the whole screen from the
       * moment the veil appears would be defensible product design, and it
       * would put a full-screen alpha blend inside the very interval lot 1d
       * measures. It is one line away (`display: block` and no `hidden`) if a
       * measurement ever shows that blend to be free.
       */
      #selection {
        position: fixed;

        /* Where a grip's 8 px of fill sits, so that its PAINTED footprint -
           fill plus 2 px of ring on each side - lands exactly inside the ring
           of grab zones and never over the interior. Derived from the same two
           tokens the ring below is drawn with, so the two cannot drift:
           near = -(8 + 2) = -10 px, far = 100% + 2 px, mid = centred. */
        --grip-near: calc(
          -1 * (var(--veil-handle-size) + var(--veil-stroke-width) * 2)
        );
        --grip-far: calc(100% + var(--veil-stroke-width) * 2);
        --grip-mid: calc(50% - var(--veil-handle-size) / 2);

        /* Overwritten by main.ts on every pointer move. Declared so the element
           has a defined geometry rather than `auto` before the first drag. */
        left: 0;
        top: 0;
        width: 0;
        height: 0;
        box-shadow:
          /* The white hairline, just inside the selected rectangle. */
          inset 0 0 0 var(--veil-stroke-width) var(--veil-stroke-light),
          /* The black one, immediately outside it. The PAIR is the signature
             and is not decorative: over a backdrop whose content is unknown,
             the better of the two strokes never drops below 4.58:1 (swept in
             scripts/check-contrast.mjs). A single colour is unreadable on some
             screenshots, whichever colour is chosen. */
            0 0 0 var(--veil-stroke-width) var(--veil-stroke-dark),
          /* Everything outside, dimmed. An outer box-shadow is clipped to
             OUTSIDE the border box, so the selected pixels stay exactly as they
             were captured - which is what the user is judging. 100vmax covers
             the largest screen dimension from any position on the screen. */
            0 0 0 100vmax var(--veil-scrim);
        /* The rectangle must not intercept the drag that is drawing it. */
        pointer-events: none;
        /* No `display` declared here on purpose, so nothing of this document's
           own has to hold `hidden` up for it.

           THAT REASONING WAS SOUND AND STILL LET A DEFECT THROUGH, which is
           worth writing down where it was made. It only ever looked at THIS
           document's declarations. components.css is linked above and declares
           `display` on `.c-toast-region` and on `.c-btn` - so the confirmation
           and its dismiss button, both parsed with `hidden`, were painted from
           the moment the veil appeared: an empty box at the foot of every
           capture, met on the installed v0.1.0 on 7 September 2026. The guard
           now lives in components.css, next to the declarations that caused it,
           and `scripts/check-hidden.mjs` fails if it leaves. */
      }

      /*
       * THE GRIPS. Eight dots, and this time they resize.
       *
       * They were REMOVED on 4 September 2026 for a reason worth keeping in
       * sight: they looked grabbable and moved nothing. What makes them
       * legitimate now is `hitTest` in src/veil/zones.ts, and nothing else -
       * under test since 4 September 2026 in src/veil/zones.test.ts.
       *
       * WHERE THEY SIT, AND WHY IT IS NOT DECORATION. Each dot is laid flush
       * OUTSIDE its corner or edge, inside the ring of grab zones. The
       * alternative - a dot straddling the corner, which is the common one -
       * would paint over the pixels the user is judging, and on the smallest
       * legal selection (8 x 8 physical px) four dots straddling four corners
       * cover the whole of it. Flush outside, the selected pixels are never
       * touched at any size, and the dot's inner corner IS the corner.
       *
       * ANGLES, NOT A RADIUS. A grip's job is to say which pixel is the corner.
       * A radius rounds off exactly that information. --radius-pill described
       * "the round tools of the veil" until these dots were removed; it stays
       * unused by this window on purpose.
       *
       * THE RING IS OUTSIDE THE FILL, and it is the same two-tone pair as the
       * selection edge and the screen band: light hairline doubled by the dark
       * one, light INSIDE so it separates the accent from the ring, dark
       * outside so the whole mark survives a white screenshot. --veil-handle is
       * pinned to a literal in tokens.css and measured against both halves
       * (6.15:1 and 3.41:1, scripts/check-contrast.mjs); it is not var(--accent),
       * which the dark theme redefines.
       */
      .grip {
        position: absolute;
        width: var(--veil-handle-size);
        height: var(--veil-handle-size);
        background: var(--veil-handle);
        box-shadow:
          0 0 0 var(--veil-stroke-width) var(--veil-stroke-light),
          0 0 0 calc(var(--veil-stroke-width) * 2) var(--veil-stroke-dark);
        /* The dots answer no pointer event: the zones do, and they are computed
           from the rectangle's geometry in main.ts. A dot that could be hit on
           its own would be a NINTH zone, overlapping the eight. */
        pointer-events: none;
      }

      .grip-nw {
        left: var(--grip-near);
        top: var(--grip-near);
      }

      .grip-ne {
        left: var(--grip-far);
        top: var(--grip-near);
      }

      .grip-sw {
        left: var(--grip-near);
        top: var(--grip-far);
      }

      .grip-se {
        left: var(--grip-far);
        top: var(--grip-far);
      }

      .grip-n {
        left: var(--grip-mid);
        top: var(--grip-near);
      }

      .grip-s {
        left: var(--grip-mid);
        top: var(--grip-far);
      }

      .grip-w {
        left: var(--grip-near);
        top: var(--grip-mid);
      }

      .grip-e {
        left: var(--grip-far);
        top: var(--grip-mid);
      }

      /*
       * A midpoint dot appears only when its own side has room for it -
       * --veil-grip-room, four grip footprints. main.ts sets these two classes
       * from the live width and height.
       *
       * THE ZONE STAYS EITHER WAY. A midpoint that is not drawn still resizes,
       * and the cursor still says so: the ring is disjoint by construction and
       * hiding a dot must not open a hole in it. Drawing is about what fits;
       * hit-testing is about what the hand can reach.
       */
      #selection:not(.has-width) > .grip-n,
      #selection:not(.has-width) > .grip-s,
      #selection:not(.has-height) > .grip-w,
      #selection:not(.has-height) > .grip-e {
        display: none;
      }

      /*
       * THE KEYBOARD LINE.
       *
       * EVERYTHING ABOUT THE PLATE ITSELF - its colours, its ring, where it
       * sits, how wide it may get and why it may not be centred with a
       * transform - is `.c-veil-hint` in src/design/components.css, linked
       * above. NOTHING of it is restated here. This document owed it two lines
       * and no more, for exactly the reasons the toast's own four are listed
       * below.
       *
       * IT WAS DRAWN HERE, IN FULL, UNTIL 7 SEPTEMBER 2026, and that is what
       * went wrong: `left: var(--gutter); right: var(--gutter)` is a 1888 px
       * black band on a 1920 px screen, laid across the taskbar. A plate no
       * page could publish is a plate nobody had ever looked at - the showcase
       * draws it now, section s-veil.
       *
       * COST AT OPENING: ZERO, unchanged, and that is a hard constraint rather
       * than a preference. It is in the document from the preheat wearing
       * `hidden`, exactly like #selection, and it is not unhidden until the
       * first pointer release - which is far behind `painted`. The measured p95
       * leaves 15.7 ms of margin on the 150 ms budget.
       *
       * IT USED TO SHARE THESE RULES WITH `#notice`, a hand-drawn plate that
       * showed whatever Rust refused. That element is GONE as of 5 September
       * 2026: the same job is now done by the system's own toast, below, which
       * is measured, published in the showcase, and carries a way out.
       */

      /* WHERE IT IS ANCHORED, and nothing else. `.c-veil-hint` is `absolute`,
         which in the application resolves against the window shell. This
         document has no positioned ancestor, so `fixed` states what is meant -
         the foot of the SCREEN - rather than relying on the initial containing
         block happening to be the same rectangle. Same line, same reason, as
         #toast-region below. */
      #hint {
        position: fixed;
      }

      /*
       * THE CONFIRMATION, AND THE FAILURE THAT DOES NOT FADE.
       *
       * Everything about the toast itself - its colours, its glyph rule, where
       * it sits, how wide it may get, that it is raised, and when it leaves -
       * comes from src/design/components.css, linked above. NOTHING of it is
       * restated here. The four rules below are what this DOCUMENT owes it, and
       * no more.
       *
       * COST AT OPENING: ZERO, again, and by the same construction. #toast-region
       * wears `hidden` from the preheat, so its whole subtree - both glyphs, the
       * message, the button - is out of the render tree until a selection has
       * been judged, which is long after `painted` and at human speed. The
       * `animation` shorthand on `.c-toast` and the `transform`/`opacity` in its
       * keyframes therefore promote nothing at parse: an element that is not
       * rendered gets no layer.
       */

      /* 1. THE BASE LAYER components.css assumes and this page does not have.
         src/styles.css gives the application `* { box-sizing: border-box }`;
         this document must not load that file. Without the rule, `.c-toast`'s
         `inline-size: 100%` measures the CONTENT box and the toast overflows
         its region by twice its padding plus twice its border. The keyboard
         line joined this rule on 7 September 2026 for the same arithmetic: its
         cap is --c-toast-max, and under `content-box` the plate would measure
         that plus twice its --space-3 padding - 440 px where the toast beside
         it is 416, two elements that are meant to look like one. Scoped to
         those two subtrees, so nothing else in this document changes. */
      #hint,
      #toast-region,
      #toast-region * {
        box-sizing: border-box;
      }

      /* 2. WHERE IT IS ANCHORED, AND WHAT THE POINTER SAYS OVER IT.
         `.c-toast-region` is `position: absolute`, which in the application
         resolves against the window shell. This document has no positioned
         ancestor, so `fixed` states what is meant - the foot of the SCREEN -
         rather than relying on the initial containing block happening to be
         the same rectangle.
         The cursor comes with it: <html> declares `crosshair` and `cursor`
         inherits, so without this line the dismiss button would invite a drag
         it does not accept. */
      #toast-region {
        position: fixed;
        cursor: default;
      }

      /* 3. WHICH GLYPH. Both are in the markup, each with its own path, and the
         tone class chooses between them - PRD A4: the semantic keeps its word
         AND its glyph, the colour is the third cue.
         `display: none` and not the `hidden` attribute: that attribute's UA
         rule is written for the HTML namespace and these two elements are SVG.
         scripts/check-icons.mjs holds both `d` values against
         src/design/Glyph.tsx, which is the one list of icon paths in this
         product: two icon sets start identical and stop being so at the first
         correction, and nothing in the build would otherwise notice. */
      #toast:not(.c-note--success) > [data-toast-glyph='success'],
      #toast:not(.c-note--danger) > [data-toast-glyph='danger'] {
        display: none;
      }

      /* 4. CONFIRMATION MODE: the veil steps out of the way.
         Set by main.ts on the root, and only after a copy has SUCCEEDED. The
         window itself is made transparent in src-tauri/src/veil.rs (`create`,
         and read the note there about what that costs the measurement) and
         stops answering the pointer in `veil_selected`; these two rules are the
         page's half of the same move. Without the first, `background: #000`
         above would paint a full-screen black rectangle and "transparent" would
         mean nothing; without the second, a two-tone band would frame a screen
         that is no longer being captured.
         A FAILURE gets neither: the veil stays opaque, keeps its band, and goes
         on answering the pointer. */
      html.is-confirmed {
        background: transparent;
      }

      html.is-confirmed #edge {
        display: none;
      }
    </style>
  </head>
  <body>
    <img id="frame" alt="" hidden />
    <!--
      THREE ELEMENTS, AND THEIR ORDER IS THE WHOLE Z-STACK. All three are
      `position: fixed` and none carries a z-index, so they paint in document
      order: image, then edge frame, then selection. No layer token is borrowed
      to restate what the markup already says - --layer-veil is about this
      WINDOW against the application, not about the elements inside it.

      #edge carries no `hidden` attribute and no script ever touches it: it is
      on screen from the moment the window is, which is the entire point of it.
      One exception, and it is declarative rather than scripted - the rule
      `html.is-confirmed #edge` above takes it away once the capture has
      SUCCEEDED, because by then there is no capture left to announce and the
      band would be framing the user's own desktop.

      It sits BEFORE #selection deliberately. #selection paints its scrim over
      everything outside the chosen rectangle, so once a drag starts the band is
      dimmed along with the rest of the screen - correct, because by then the
      drag itself says the veil is armed and the band has done its job. The dark
      half of the pair is a black scrim's own colour and is untouched by it, so
      the frame is dimmed, never erased.
    -->
    <div id="edge"></div>
    <!--
      The eight grips are CHILDREN of #selection, and that is what makes them
      free: `[hidden]` on the parent takes the whole subtree out of the render
      tree, so nothing here is laid out or painted before the first drag. They
      are also painted ABOVE the parent's box-shadows - a box-shadow belongs to
      the element's own background layer, descendants come after - so a dot
      outside the rectangle is drawn over the scrim rather than under it.

      Their order is the reading order of the ring, not a z-stack: none of them
      overlaps another, at any size, because each sits in its own zone.
    -->
    <div id="selection" hidden>
      <div class="grip grip-nw"></div>
      <div class="grip grip-n"></div>
      <div class="grip grip-ne"></div>
      <div class="grip grip-w"></div>
      <div class="grip grip-e"></div>
      <div class="grip grip-sw"></div>
      <div class="grip grip-s"></div>
      <div class="grip grip-se"></div>
    </div>
    <!--
      AFTER #selection, so the plate paints over its scrim. It carries `hidden`
      from the preheat: see the note above its rules for why nothing may be
      built at capture time.

      IT CARRIES NO WORDING, since 7 September 2026. It used to hold « Enter or
      double-click copies · Esc cancels », typed here - the ONE sentence of this
      product that never passed through src/strings.ts, and the only one still
      in English in a French interface. It is written once during the preheat by
      src/veil/main.ts, from UI_STRINGS.veilHint, exactly as the dismiss
      button's aria-label beside it is. An element nothing writes into would be
      the 7 September defect over again - an empty box at the foot of every
      capture - so src/documents.test.ts holds both halves: no sentence here,
      and a sentence written there.
    -->
    <p id="hint" class="c-veil-hint" hidden></p>
    <!--
      THE TOAST. One element for both outcomes, and the choice is worth stating
      because the other one was tried on paper first.

      TWO elements - a success and a failure, each with its tone class and its
      `role` written here - would let a screen reader see both live regions from
      the preheat, which is the friendlier order. It would also put the class
      list of the maquette in an HTML file that no test reads, free to drift
      from `planFor` in src/veil/confirmation.ts, which is the thing under test.
      ONE element, dressed from the plan, keeps a single source for the markup
      and pays for it with a `role` set at the moment the region is revealed.
      That is the trade, taken deliberately.

      NOTHING BELOW CARRIES A WORD. Every label the user reads is written by
      main.ts from src/strings.ts - the catalogue scripts/check-strings.mjs
      holds against src/design/Showcase.tsx, character for character. The three
      empty spans are the three nodes of the maquette's sentence: a figure in
      the numeric face, a bold lead, and the rest. The whitespace between them
      would be text: they are kept on one line for that reason, and the spacing
      the sentence needs travels inside `plan.text`.
    -->
    <div class="c-toast-region" id="toast-region" hidden>
      <div class="c-note c-toast" id="toast">
        <svg
          class="c-btn__glyph"
          data-toast-glyph="success"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M5 13l4 4L19 7" />
        </svg>
        <svg
          class="c-btn__glyph"
          data-toast-glyph="danger"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M12 8v5M12 17h.01M12 3l9 17H3l9-17Z" />
        </svg>
        <span class="c-toast__message"><span class="c-num" id="toast-measurement" hidden></span><strong id="toast-lead" hidden></strong><span id="toast-text"></span></span>
        <button type="button" class="c-btn c-btn--ghost c-btn--icon c-toast__dismiss" id="toast-dismiss" hidden>
          <svg
            class="c-btn__glyph"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M6 6l12 12M18 6L6 18" />
          </svg>
        </button>
      </div>
    </div>
    <script type="module" src="/src/veil/main.ts"></script>
  </body>
</html>
